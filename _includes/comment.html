<!-- Render a single Staticman comment. -->


<article class="js_comment comment" id="comment{{ include.index }}" itemprop="comment" itemscope itemtype="https://schema.org/Comment">
    <div class="comment_avatar_wrapper">
        <img class="comment_avatar" src="https://www.gravatar.com/avatar/{{ include.email }}?d=mm&s=80" alt="{{ include.name }}" loading="lazy" decoding="async">
    </div>

    <div class="comment_content_wrapper">
        <h3 class="comment_author" itemprop="author" itemscope itemtype="https://schema.org/Person">
            {% if include.url and include.url != empty %}
                <span itemprop="name">
                    <a href="{{ include.url }}" rel="external nofollow" itemprop="url">{{ include.name }}</a>
                </span>
            {% else %}
                <span itemprop="name">{{ include.name }}</span>
            {% endif %}
        </h3>

        <p class="comment_date">
            {% if include.date %}
                {% if include.index %}<a href="#comment{{ include.index }}" itemprop="url">{% endif %}
                    <time datetime="{{ include.date | date_to_xmlschema }}" itemprop="datePublished">{{ include.date | date: "%B %-d, %Y at %I:%M %p" }}</time>
                {% if include.index %}</a>{% endif %}
            {% endif %}
        </p>

        <div itemprop="text">{{ include.message | markdownify }}</div>
    </div>
</article>
