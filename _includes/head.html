<!-- Render metadata and global resources in the document head. -->


<meta charset="utf-8">

{% include seo.html %}

{% unless site.atom_feed.hide %}
    <link rel="alternate" href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}" type="application/atom+xml" title="{{ site.title }} Feed">
{% endunless %}

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
    document.documentElement.classList.replace("no_js", "js");
</script>

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css" as="style" onload="this.onload = null; this.rel = &quot;stylesheet&quot;;">
<noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@latest/css/all.min.css">
</noscript>

{% if site.head_scripts %}
    {% for script in site.head_scripts %}
        <script src="{{ script | relative_url }}"></script>
    {% endfor %}
{% endif %}
