<!-- Load Universal Analytics. -->


<script>
    window.ga = function () {
        window.ga.q.push(arguments);
    };

    window.ga.q = [];
    window.ga.l = Date.now();

    ga("create", {{ site.analytics.google.tracking_id | jsonify }}, "auto");
    ga("set", "anonymizeIp", {{ site.analytics.google.anonymize_ip | default: false | jsonify }});
    ga("send", "pageview");
</script>

<script src="https://www.google-analytics.com/analytics.js" async></script>
