<!-- Load Google Analytics through gtag.js. -->


<script src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.tracking_id }}" async></script>

<script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
        window.dataLayer.push(arguments);
    }

    gtag("js", new Date());
    gtag("config", {{ site.analytics.google.tracking_id | jsonify }}, {"anonymize_ip": {{ site.analytics.google.anonymize_ip | default: false | jsonify }}, });
</script>
