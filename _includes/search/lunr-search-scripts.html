<!-- Load Lunr search data and controls. -->


{% assign search_locale = include.locale | default: site.locale %}
{% assign search_language = search_locale | slice: 0, 2 | default: "en" %}

<script src="{{ '/assets/js/lunr/lunr.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/lunr/lunr_store.js' | relative_url }}"></script>

{% if search_language == "en" %}
    <script src="{{ '/assets/js/lunr/lunr_en.js' | relative_url }}"></script>
{% endif %}

<script src="{{ '/assets/js/lunr/lunr_search.js' | relative_url }}"></script>
