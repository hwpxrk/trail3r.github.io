<!-- Render keyboard-accessible skip links. -->


<nav class="skip_links" aria-label="빠른 이동">
    <ul>
        <li>
            <a class="screen_reader_shortcut" href="#site_navigation">
                {{ site.data.ui-text[site.locale].skip_primary_nav | default: "Skip to primary navigation" }}
            </a>
        </li>
        <li>
            <a class="screen_reader_shortcut" href="#main">{{ site.data.ui-text[site.locale].skip_content | default: "Skip to content" }}</a>
        </li>
        <li>
            <a class="screen_reader_shortcut" href="#footer">{{ site.data.ui-text[site.locale].skip_footer | default: "Skip to footer" }}</a>
        </li>
    </ul>
</nav>
