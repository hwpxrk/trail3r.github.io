<!-- Load Discourse comments. -->


{% if site.comments.discourse.server %}
    {% capture canonical_url %}
        {% if site.permalink contains ".html" %}
            {{ page.url | absolute_url }}
        {% else %}
            {{ page.url | absolute_url | remove: "index.html" | strip_slash }}
        {% endif %}
    {% endcapture %}

    <script>
        window.DiscourseEmbed = {
            discourseUrl: {{ site.comments.discourse.server | prepend: "//" | append: "/" | jsonify }},
            discourseEmbedUrl: {{ canonical_url | strip | jsonify }},
        };

        (() => {
            "use strict";

            const script = document.createElement("script");
            const target = document.head || document.body;

            script.src = `${window.DiscourseEmbed.discourseUrl}javascripts/embed.js`;
            script.async = true;
            target.append(script);
        })();
    </script>

    <noscript>Please enable JavaScript to view the comments powered by <a href="https://www.discourse.org/">Discourse.</a></noscript>
{% endif %}
